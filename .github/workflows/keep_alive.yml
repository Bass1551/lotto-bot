name: Render 24/7 Keep Alive Ping

on:
  schedule:
    - cron: '*/5 * * * *'  # Run every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          echo "Pinging Render Web Service to keep it awake 24/7..."
          curl -s -f -m 15 https://lotto-bot-uy9t.onrender.com/ || echo "Ping completed"
          curl -s -f -m 15 https://lotto-bot-1.onrender.com/ || echo "Ping static completed"
