<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ป้อนผลสลากด่วน</title>
    <style>
        body {
            background-color: #181A20;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 20px 15px;
            margin: 0;
        }
        .card {
            background: #1E222D;
            border-radius: 16px;
            padding: 25px 20px;
            max-width: 420px;
            margin: 20px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: left;
        }
        h2 {
            text-align: center;
            color: #28A745;
            margin-top: 0;
        }
        label {
            font-size: 14px;
            color: #A0AAB8;
            margin-top: 15px;
            display: block;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            background: #141721;
            border: 1px solid #2C3242;
            color: #FFF;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 5px;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #28A745;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row > div {
            flex: 1;
        }
        .btn {
            background: #28A745;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 25px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(40,167,69,0.4);
            transition: transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }
        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        .success { color: #28A745; }
        .error { color: #FF4D4D; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ ป้อนผลสลากส่งด่วนเข้าไลน์</h2>
        
        <label for="lotto-select">🎯 เลือกชื่อหวย:</label>
        <select id="lotto-select"></select>

        <div class="row">
            <div>
                <label for="top3">🔴 3 ตัวบน:</label>
                <input type="number" id="top3" placeholder="เช่น 123" maxlength="3" oninput="if(this.value.length>3)this.value=this.value.slice(0,3)">
            </div>
            <div>
                <label for="bottom2">🔵 2 ตัวล่าง:</label>
                <input type="number" id="bottom2" placeholder="เช่น 45" maxlength="2" oninput="if(this.value.length>2)this.value=this.value.slice(0,2)">
            </div>
        </div>

        <button class="btn" onclick="sendQuickResult()">🚀 ยิงการ์ดเข้ากลุ่มไลน์ทันที</button>
        <div id="status"></div>
    </div>

    <script>
        async function loadConfig() {
            try {
                const res = await fetch('/config.json');
                const lotteries = await res.json();
                const select = document.getElementById('lotto-select');
                select.innerHTML = '';
                lotteries.forEach(l => {
                    const opt = document.createElement('option');
                    opt.value = l.name;
                    opt.textContent = (l.flag || '🎯') + ' ' + l.name + ' (' + l.time + ' น.)';
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("Failed to load config:", err);
            }
        }

        async function sendQuickResult() {
            const name = document.getElementById('lotto-select').value;
            const top3 = document.getElementById('top3').value.trim();
            const bottom2 = document.getElementById('bottom2').value.trim();
            const statusEl = document.getElementById('status');

            if (!top3 || top3.length !== 3) {
                statusEl.className = 'error';
                statusEl.innerText = '❌ กรุณากรอก 3 ตัวบนให้ครบ 3 หลัก';
                return;
            }
            if (!bottom2 || bottom2.length !== 2) {
                statusEl.className = 'error';
                statusEl.innerText = '❌ กรุณากรอก 2 ตัวล่างให้ครบ 2 หลัก';
                return;
            }

            statusEl.className = '';
            statusEl.innerText = '⏳ กำลังยิงการ์ดเข้าไลน์...';

            try {
                const res = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, top3, bottom2 })
                });
                const data = await res.json();
                if (data.ok) {
                    statusEl.className = 'success';
                    statusEl.innerText = '✅ ยิงผลสลากเข้าไลน์เรียบร้อยแล้ว!';
                    document.getElementById('top3').value = '';
                    document.getElementById('bottom2').value = '';
                } else {
                    statusEl.className = 'error';
                    statusEl.innerText = '❌ เกิดข้อผิดพลาด: ' + (data.error || 'ไม่สามารถส่งได้');
                }
            } catch (err) {
                statusEl.className = 'error';
                statusEl.innerText = '❌ เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
            }
        }

        loadConfig();
    </script>
</body>
</html>
