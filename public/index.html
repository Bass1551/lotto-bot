<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Lotto Result</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            background-color: #181A20;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .card {
            background: #1E222D;
            border-radius: 16px;
            padding: 30px 20px;
            max-width: 400px;
            margin: 40px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .btn {
            background: #28A745;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(40,167,69,0.4);
            transition: transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .status-text {
            color: #A0AAB8;
            font-size: 14px;
            margin-top: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="title" style="font-size:20px; margin-bottom:10px;">ระบบแชร์ผลสลาก</h2>
        <p id="desc" class="status-text">กดปุ่มด้านล่างเพื่อเปิดหน้าต่างเลือกกลุ่มส่งผลสลาก</p>
        <div id="action-area">
            <button id="share-btn" class="btn" onclick="doShare()">📤 คลิกที่นี่เพื่อเลือกกลุ่มแชร์</button>
        </div>
    </div>

    <script>
        let globalFlexMessage = null;

        function createCleanFlex(name, top3, bottom2, flag) {
            var top3_fmt = top3.padStart(3, '0').slice(-3).split('').join('  ');
            var bottom2_fmt = bottom2.padStart(2, '0').slice(-2).split('').join('  ');

            return {
                "type": "bubble",
                "size": "mega",
                "header": {
                    "type": "box",
                    "layout": "horizontal",
                    "backgroundColor": "#1E222D",
                    "paddingAll": "lg",
                    "alignItems": "center",
                    "contents": [
                        { "type": "text", "text": flag, "size": "xl", "flex": 0 },
                        { "type": "text", "text": " " + name, "weight": "bold", "size": "xl", "color": "#FFFFFF", "flex": 1 }
                    ]
                },
                "body": {
                    "type": "box",
                    "layout": "vertical",
                    "backgroundColor": "#181A20",
                    "spacing": "md",
                    "paddingAll": "lg",
                    "contents": [
                        {
                            "type": "box",
                            "layout": "vertical",
                            "backgroundColor": "#2A181A",
                            "cornerRadius": "md",
                            "paddingAll": "md",
                            "spacing": "xs",
                            "contents": [
                                { "type": "text", "text": "🔺 3 ตัวบน", "size": "sm", "color": "#FF6B6B", "weight": "bold" },
                                { "type": "text", "text": top3_fmt, "size": "3xl", "weight": "bold", "color": "#FF4D4D", "align": "center" }
                            ]
                        },
                        {
                            "type": "box",
                            "layout": "vertical",
                            "backgroundColor": "#142438",
                            "cornerRadius": "md",
                            "paddingAll": "md",
                            "spacing": "xs",
                            "contents": [
                                { "type": "text", "text": "🔻 2 ตัวล่าง", "size": "sm", "color": "#4DABFF", "weight": "bold" },
                                { "type": "text", "text": bottom2_fmt, "size": "3xl", "weight": "bold", "color": "#00D2FF", "align": "center" }
                            ]
                        }
                    ]
                }
            };
        }

        async function initLiff() {
            const titleEl = document.getElementById('title');
            const descEl = document.getElementById('desc');

            try {
                await liff.init({ liffId: '2011157640-izadxULb' });

                let searchStr = window.location.search;
                const searchParams = new URLSearchParams(searchStr);
                if (searchParams.has('liff.state')) {
                    searchStr = searchParams.get('liff.state');
                    if (searchStr.startsWith('?')) searchStr = searchStr.substring(1);
                }

                const urlParams = new URLSearchParams(searchStr);
                const n = urlParams.get('n') || 'ผลสลาก';
                const t = urlParams.get('t') || '000';
                const b = urlParams.get('b') || '00';
                const f = urlParams.get('f') || '🎯';

                const bubbleObj = createCleanFlex(n, t, b, f);
                globalFlexMessage = {
                    "type": "flex",
                    "altText": f + " " + n + " 3บน: " + t + " 2ล่าง: " + b,
                    "contents": bubbleObj
                };

                if (liff.isInClient()) {
                    // Automatically trigger inside LINE App
                    doShare();
                }
            } catch (err) {
                console.error("LIFF Init Error:", err);
            }
        }

        async function doShare() {
            const titleEl = document.getElementById('title');
            const descEl = document.getElementById('desc');

            if (!liff.isLoggedIn()) {
                liff.login({ redirectUri: window.location.href });
                return;
            }

            if (!globalFlexMessage) {
                descEl.innerText = "กำลังเตรียมข้อมูล...";
                return;
            }

            try {
                if (liff.isApiAvailable('shareTargetPicker')) {
                    const res = await liff.shareTargetPicker([globalFlexMessage]);
                    if (res) {
                        titleEl.innerText = "ส่งผลสลากสำเร็จ! 🎉";
                        descEl.innerText = "ส่งไปยังกลุ่มที่เลือกเรียบร้อยแล้ว";
                    }
                    if (liff.isInClient()) {
                        liff.closeWindow();
                    }
                } else {
                    alert('อุปกรณ์นี้ไม่รองรับ Share Target Picker');
                }
            } catch (err) {
                console.error("Share Error:", err);
                alert("เกิดข้อผิดพลาดในการแชร์: " + err.message);
            }
        }

        initLiff();
    </script>
</body>
</html>
